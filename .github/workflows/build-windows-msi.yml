name: Build Windows MSI

# 手动触发，或推送 v* tag 时触发。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  FRB_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  LLVM_VERSION: "15.0.6"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    name: Windows x64 MSI
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}
          directory: ${{ runner.temp }}/llvm

      - name: Export LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=${{ runner.temp }}/llvm/bin" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          # flutter_rust_bridge_codegen 生成 Rust 代码后要调 rustfmt
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-windows-msi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # 快速失败检查：这些缺一个后面都会以很难懂的方式报错。
      - name: Preflight checks
        run: |
          rustfmt --version
          python --version
          test -f res/icon.ico
          test -f res/manifest.xml
          assets="$(ls flutter/assets | wc -l)"
          echo "flutter/assets entries: $assets"
          test "$assets" -ge 60

      # 仓库里不含生成的 FFI 桥接文件（gitignore），必须先跑一次 codegen。
      - name: Install FFI codegen
        run: |
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --features uuid --locked

      - name: Generate FFI bridge
        run: |
          flutter config --enable-windows-desktop
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart
          test -f src/bridge_generated.rs
          test -f flutter/lib/generated_bridge.dart
          # frb 1.x 只有在生成结果里带 part 时才需要 freezed 代码生成。
          if grep -q "part 'generated_bridge.freezed.dart'" flutter/lib/generated_bridge.dart; then
            (cd flutter && dart run build_runner build --delete-conflicting-outputs)
          fi

      # build.py 会依次执行 cargo build --lib、flutter build windows --release，
      # 并把虚拟屏 dylib 拷进产物目录。--skip-portable-pack 只跳过单文件打包。
      # 需要硬件编码时改成 --hwcodec --vram，并额外准备 vcpkg（见 README / 上游 workflow）。
      - name: Build RustDesk
        run: |
          rustc -vV
          python build.py --flutter --skip-portable-pack

      - name: Stage distribution
        run: |
          rm -rf rustdesk
          cp -r "flutter/build/windows/x64/runner/Release" rustdesk
          ls -la rustdesk

      # WiX 4 + 原生 CustomActions，需要用 VS2022 的 MSBuild。
      - name: Build MSI
        run: |
          cd res/msi
          python preprocess.py --arp -d ../../rustdesk
          curl -fsSL -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          # WiX SDK 是 MSBuild SDK 形式，nuget 失败时回退到 msbuild -t:restore
          ./nuget.exe restore msi.sln || msbuild msi.sln -t:restore -p:RestorePackagesConfig=true
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 -p:TargetVersion=Windows10 \
            -fl -flp:logfile=msbuild.log

      - name: Collect MSI
        run: |
          msi="$(find res/msi/Package/bin -name Package.msi -path '*Release*' | head -n 1)"
          if [ -z "$msi" ]; then
            echo "::error::Package.msi not found, listing build output:"
            find res/msi/Package/bin -maxdepth 5 -type f 2>/dev/null | head -n 50
            exit 1
          fi
          echo "found: $msi"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          mkdir -p out
          cp "$msi" "out/rustdesk-${version}-x64.msi"
          sha256sum out/*.msi | tee out/SHA256SUMS.txt
          ls -l out

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            res/msi/msbuild.log
            res/msi/**/*.log
            res/msi/**/*.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-msi
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # 推 v* tag 时（push.tags 触发）才会跑，workflow_dispatch 不发 Release。
  release:
    name: Publish GitHub Release
    needs: build-msi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-windows-x64-msi
          path: out

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          title="RustDesk $TAG"
          notes="Windows x64 MSI（${{ github.repository }} @ ${GITHUB_SHA:0:7}）
          - 未签名，安装时 SmartScreen 会提示“未知发布者”
          - 软件编解码（未启用 hwcodec/vram）
          - 校验值见 SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "$notes" --verify-tag
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url
